packages:
  - 'packages/*'

# better-sqlite3 is a native module and needs its build script to run.
# pnpm 10 blocks postinstall scripts unless a package is listed here.
onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - esbuild

# Blocked on purpose. onnxruntime-node (via @huggingface/transformers,
# the bench's embedder) ships its CPU binaries in the package; its
# postinstall only downloads GPU providers. protobufjs's only prints a
# notice, and sharp (image input, unused here) is not needed.
ignoredBuiltDependencies:
  - onnxruntime-node
  - protobufjs
  - sharp
